spring.application.name=genai-be

# ================================
# DATABASE CONFIGURATION
# ================================
spring.datasource.url=jdbc:postgresql://localhost:5432/genai
spring.datasource.username=genai
spring.datasource.password=genai
spring.datasource.driver-class-name=org.postgresql.Driver

management.endpoints.web.exposure.include=health


# ================================
# JPA / HIBERNATE
# ================================
# spring.jpa.hibernate.ddl-auto=update # disable this because we are using flyway
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ================================
# CONNECTION POOL (Hikari)
# ================================
# spring.datasource.hikari.maximum-pool-size=10
# spring.datasource.hikari.minimum-idle=2
# spring.datasource.hikari.idle-timeout=30000
# spring.datasource.hikari.connection-timeout=20000
# spring.datasource.hikari.max-lifetime=1800000

# You must have installed locally the database so it could be run backend on its own without docker postgres image after enabling jpa in pom.xml
# PostgreSQL 14–16 (recommended)
# A database named: genai
# A user named: genai
# A password: genai
# Create them with (sql):
# CREATE DATABASE genai;
# CREATE USER genai WITH PASSWORD 'genai';
# GRANT ALL PRIVILEGES ON DATABASE genai TO genai;
